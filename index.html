<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1730">
<title>ياد رويال للعقارات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#0b1730;--mut:#6b7690;--gold:#c9a24b;--navy:#0b1730;--line:#e3e8f1;--ok:#16a34a;--bad:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#070d1c;--card:#101a33;--ink:#eef2fb;--mut:#93a0bd;--line:#1f2c4d}}
*{box-sizing:border-box;margin:0}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
header{background:linear-gradient(135deg,#0b1730,#17295a);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 70px;position:relative}
.top{max-width:1150px;margin:auto;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;flex:1}
.logo b{font-size:26px;font-weight:800;color:var(--gold);line-height:1}
.logo small{display:block;font-size:12px;color:#c8d2ea}
.u{display:flex;align-items:center;gap:8px;font-size:13px}
.u img,.av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#2a3d73;border:2px solid var(--gold)}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--gold);color:#1b1405}
.btn.g{background:rgba(255,255,255,.14);color:#fff}.btn.l{background:var(--line);color:var(--ink)}.btn.r{background:var(--bad);color:#fff}
main{max-width:1150px;margin:-52px auto 0;padding:0 14px 90px;position:relative}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.st{background:var(--card);border-radius:16px;padding:14px;cursor:pointer;border:2px solid transparent;box-shadow:0 6px 20px #0b173014;transition:.2s}
.st.on{border-color:var(--gold)}.st b{font-size:28px;display:block;color:var(--gold)}.st span{font-size:13px;color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.bar input,.bar select,.f input,.f select,.f textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.bar input{flex:1;min-width:150px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;cursor:pointer;font-size:14px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pc{background:var(--card);border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:0 4px 16px #0b17301a;transition:.2s}
.pc:hover{transform:translateY(-3px)}
.im{height:170px;background:linear-gradient(135deg,#1b2b57,#0b1730) center/cover;position:relative}
.tag{position:absolute;top:10px;right:10px;background:var(--gold);color:#1b1405;border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700}
.tag.s{right:auto;left:10px;background:#fff;color:#111}
.pb{padding:12px 14px}.pb h3{font-size:16px;margin-bottom:4px}.pr{color:var(--gold);font-weight:800;font-size:18px}
.mt{color:var(--mut);font-size:13px;display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.mt span{display:flex;align-items:center;gap:6px}.mt img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:18px;z-index:5;box-shadow:0 8px 24px #c9a24b66;padding:14px 22px;border-radius:30px;font-size:16px}
.ov{position:fixed;inset:0;background:#050a18cc;z-index:10;display:flex;align-items:flex-end;justify-content:center;overflow-y:auto}
.md{background:var(--bg);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px;max-height:94vh;overflow-y:auto;margin-top:auto}
@media(min-width:700px){.ov{align-items:center}.md{border-radius:22px;margin:auto}}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:13px;color:var(--mut);display:block}.f .w{grid-column:1/-1}
.f input,.f select,.f textarea{width:100%;margin-top:3px}.f .ck{display:flex;align-items:center;gap:8px;color:var(--ink)}.f .ck input{width:auto;margin:0}
.row{display:flex;gap:8px;align-items:end}.row>*:first-child{flex:1}
.ph{display:flex;gap:8px;overflow-x:auto;margin-top:6px}.ph div{position:relative;flex:none}.ph img{width:76px;height:76px;object-fit:cover;border-radius:10px}
.ph i{position:absolute;top:2px;left:2px;background:var(--bad);color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;font-style:normal;font-size:13px;line-height:20px}
.gal{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:14px}.gal img{height:230px;max-width:90%;scroll-snap-align:start;border-radius:14px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.kv div{background:var(--card);border-radius:12px;padding:8px 12px;font-size:14px}.kv small{color:var(--mut);display:block}
.ag{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px;margin:10px 0}
.ag img{width:52px;height:52px;border-radius:50%;object-fit:cover}.ag div{flex:1}
.lg{max-width:380px;margin:12vh auto;padding:0 18px}.lg .md{border-radius:22px;max-height:none}
.err{color:var(--bad);font-size:13px;margin-top:8px}
.empty{text-align:center;color:var(--mut);padding:50px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== الإعداد: ضع رابط Apps Script Web App هنا ===== */
const API = 'https://script.google.com/macros/s/AKfycbx1mec5fcRaYLkI0h_4OUm0_8xfkL3F1POCLuM_tJxWQMCV4CBwd-OentORphltNOe0Dg/exec';

const CATS = {rent:'للإيجار', sale:'للبيع', invest:'استثمار', contract:'مقاولاتي'};
const RES = ['house','apt','farm','rest','shop'];
const LANDS = ['land_res','land_agr','land_tour','land_inv'];
const TYPES = {rent:[...RES,...LANDS,'other'], sale:[...RES,...LANDS,'other'], invest:['land','bldg','proj','other'], contract:['build','finish','maint','other']};
const TN = {house:'منزل',apt:'شقة',farm:'مزرعة',rest:'مطعم',shop:'محل تجاري',land:'أرض',bldg:'بناية',proj:'مشروع',build:'بناء وإنشاء',finish:'تشطيب وديكور',maint:'صيانة وترميم',land_res:'قطعة أرض سكني',land_agr:'أرض زراعي',land_tour:'أرض سياحي',land_inv:'أرض استثمار',other:'غير ذلك'};
const tn = p => p.type === 'other' ? (p.data.customType || 'غير ذلك') : tn(p);
const YN = ['نعم','لا'];
const FT = { // الحقول الخاصة بكل نوع عقار: [مفتاح، عنوان، نوع(n/s/t/c)، خيارات]
 house:[['m2','المساحة (م²)','n'],['built','المساحة المبنية (م²)','n'],['floors','عدد الطوابق','n'],['rooms','غرف النوم','n'],['baths','الحمامات','n'],['hall','الصالات','n'],['age','عمر البناء (سنة)','n'],['furn','الأثاث','s',['غير مفروش','مفروش','نصف مفروش']],['park','موقف سيارات','c'],['garden','حديقة','c'],['ac','تكييف','c'],['gen','مولد/طاقة بديلة','c'],['water','خزان ماء','c']],
 apt:[['m2','المساحة (م²)','n'],['floor','رقم الطابق','n'],['rooms','غرف النوم','n'],['baths','الحمامات','n'],['hall','الصالات','n'],['age','عمر البناء (سنة)','n'],['furn','الأثاث','s',['غير مفروش','مفروش','نصف مفروش']],['lift','مصعد','c'],['park','موقف سيارات','c'],['balc','شرفة','c'],['ac','تكييف','c'],['gen','مولد/طاقة بديلة','c']],
 farm:[['dunum','مساحة الأرض (دونم)','n'],['water','مصدر المياه','s',['بئر','نهر/قناة','شبكة','لا يوجد']],['trees','عدد الأشجار','n'],['crop','نوع الزراعة','t'],['house','يوجد بيت/استراحة','c'],['fence','مسيّجة','c'],['elec','كهرباء','c'],['road','طريق معبّد','c']],
 rest:[['m2','المساحة (م²)','n'],['seats','عدد المقاعد','n'],['floors','عدد الطوابق','n'],['kitchen','مطبخ مجهّز','c'],['equip','معدات/أثاث مشمولة','c'],['lic','رخصة نشاط','c'],['park','موقف سيارات','c'],['ac','تكييف','c'],['gen','مولد','c'],['main','على شارع رئيسي','c']],
 shop:[['m2','المساحة (م²)','n'],['front','عرض الواجهة (م)','n'],['floor','الطابق','s',['أرضي','أول','ثاني','قبو']],['use','نوع النشاط','t'],['mezz','ميزانين','c'],['wc','حمام','c'],['ac','تكييف','c'],['main','على شارع رئيسي','c'],['mall','داخل مجمّع','c']],
 land:[['m2','المساحة (م²)','n'],['ltype','تصنيف الأرض','s',['سكنية','تجارية','زراعية','صناعية']],['street','عرض الشارع (م)','n'],['corner','قطعة زاوية','c'],['util','خدمات (ماء/كهرباء)','c'],['plan','مفرزة/مخطط معتمد','c']],
 bldg:[['m2','مساحة الأرض (م²)','n'],['floors','عدد الطوابق','n'],['units','عدد الوحدات','n'],['age','عمر البناء (سنة)','n'],['income','الدخل الشهري الحالي','n'],['lift','مصعد','c'],['full','مؤجّرة بالكامل','c']],
 proj:[['m2','مساحة المشروع (م²)','n'],['stage','مرحلة المشروع','s',['فكرة','تخطيط','قيد التنفيذ','جاهز']],['pkind','نوع المشروع','t'],['lic','تراخيص','c']],
 build:[['m2','المساحة (م²)','n'],['floors','عدد الطوابق','n'],['plan','مخططات جاهزة','c'],['perm','إجازة بناء','c']],
 finish:[['m2','المساحة (م²)','n'],['level','مستوى التشطيب','s',['اقتصادي','متوسط','فاخر']],['plan','تصميم داخلي مشمول','c']],
 maint:[['m2','المساحة (م²)','n'],['kind','نوع العمل','t'],['urgent','مستعجل','c']],
 land_res:[['m2','المساحة (م²)','n'],['street','عرض الشارع (م)','n'],['corner','قطعة زاوية','c'],['util','خدمات (ماء/كهرباء/مجاري)','c'],['plan','مفرزة / مخطط معتمد','c'],['near','قريبة من (مدرسة، سوق...)','t']],
 land_agr:[['dunum','المساحة (دونم)','n'],['water','مصدر المياه','s',['بئر','نهر/قناة','شبكة','ديم (أمطار)','لا يوجد']],['trees','عدد الأشجار','n'],['crop','نوع الزراعة','t'],['fence','مسيّجة','c'],['elec','كهرباء','c'],['road','طريق معبّد','c']],
 land_tour:[['m2','المساحة (م²)','n'],['view','الإطلالة','s',['نهر','جبل','بحيرة','طريق سياحي','غير ذلك']],['spot','قريبة من موقع سياحي','t'],['road','طريق معبّد','c'],['util','خدمات (ماء/كهرباء)','c'],['lic','إمكانية ترخيص سياحي','c']],
 land_inv:[['m2','المساحة (م²)','n'],['use','الاستخدام المقترح','s',['تجاري','سكني','صناعي','مختلط']],['street','عرض الشارع (م)','n'],['corner','قطعة زاوية','c'],['util','خدمات (ماء/كهرباء)','c'],['plan','مخطط معتمد','c']],
 other:[['customType','نوع العقار (اكتب هنا)','t'],['m2','المساحة (م²)','n']]
};
const CF = {
 rent:[['period','مدة الإيجار','s',['شهري','سنوي','6 أشهر']],['deposit','التأمين','n'],['minterm','أقل مدة عقد','t'],['avail','تاريخ الجاهزية','t']],
 sale:[['deed','نوع الملكية','s',['طابو','عقد زراعي','عقد مؤقت','أخرى']],['nego','السعر قابل للتفاوض','c'],['inst','إمكانية التقسيط','c']],
 invest:[['roi','العائد المتوقع %','n'],['cost','التكلفة الكلية','n'],['share','حصة المستثمر %','n'],['dur','مدة المشروع','t']],
 contract:[['scope','نطاق العمل','t'],['dur','المدة المتوقعة','t'],['mat','المواد','s',['على المقاول','على المالك']]]
};
const STAT = ['متاح','محجوز','مؤجّر / مباع'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = {token:localStorage.yr_t||'', me:null, props:[], areas:[], users:[], cat:'all', type:'all', area:'all', q:'', reqs:[], view:'props', rs:'all'};
let IM = [], PHOTO = '', CUR = 'USD';
const MK = ['deposit','cost','income'];
function curDraw() { $('#cc').innerHTML = [['USD','دولار $'],['IQD','دينار عراقي']].map(([c,l]) => `<span class="chip ${CUR === c ? 'on' : ''}" onclick="CUR='${c}';curDraw()">${l}</span>`).join(''); }

async function api(action, d = {}) {
  const r = await fetch(API, {method:'POST', body:JSON.stringify({action, token:S.token, ...d})});
  const j = await r.json();
  if (j.error) { if (j.error === 'auth') logout(); throw new Error(j.error === 'auth' ? 'انتهت الجلسة' : j.error); }
  return j;
}
function logout() { localStorage.removeItem('yr_t'); S.token = ''; S.me = null; draw(); }
const perm = k => S.me && (S.me.role === 'admin' || S.me.perms[k]);
const canMod = (p, k) => S.me.role === 'admin' || (perm(k) && p.agentId === S.me.id);
const money = p => (Number(p.price) || 0).toLocaleString('en') + (p.currency === 'IQD' ? ' د.ع' : ' $') + (p.category === 'rent' ? ' / ' + (p.data.period || 'شهري') : '');
const LOGO = `<svg width="46" height="46" viewBox="0 0 48 48"><rect width="48" height="48" rx="14" fill="#c9a24b"/><path d="M10 25 24 13l14 12v12H10z" fill="#0b1730"/><path d="M15 12l4 4 5-6 5 6 4-4-2 7H17z" fill="#fff"/><rect x="20" y="28" width="8" height="9" rx="1" fill="#c9a24b"/></svg>`;

function draw() { S.me ? drawMain() : drawLogin(); }

function drawLogin() {
  $('#app').innerHTML = `<div class="lg"><div style="text-align:center;margin-bottom:18px">${LOGO}<h1 style="color:var(--gold);margin-top:8px">ياد رويال</h1><p style="color:var(--mut)">للعقارات والاستثمار</p></div>
  <div class="md f" style="display:block"><label>رقم الهاتف<input id="lp" inputmode="tel"></label><label style="margin-top:10px">كلمة السر<input id="lw" type="password"></label>
  <button class="btn" style="width:100%;margin-top:14px" onclick="login()">تسجيل الدخول</button><div class="err" id="le"></div></div></div>`;
}
async function login() {
  $('#le').textContent = '';
  try {
    const r = await api('login', {phone:$('#lp').value, pass:$('#lw').value});
    S.token = r.token; localStorage.yr_t = r.token; await load();
  } catch (e) { $('#le').textContent = e.message; }
}
async function load() {
  try { const r = await api('list'); Object.assign(S, {me:r.me, props:r.props, reqs:r.reqs || [], areas:r.areas, users:r.users}); draw(); }
  catch (e) { if (S.token) alert(e.message); draw(); }
}

const hdr = () => `<header><div class="top"><div class="logo">${LOGO}<div><b>ياد رويال</b><small>للعقارات والاستثمار</small></div></div>
   <div class="u">${S.me.photo ? `<img src="${esc(S.me.photo)}">` : '<div class="av"></div>'}<span>${esc(S.me.name)}</span>
   ${S.me.role === 'admin' ? '<button class="btn g" onclick="agents()">المندوبون</button>' : ''}<button class="btn g" onclick="logout()">خروج</button></div></div></header>`;
const tabs = () => `<div class="stats" style="grid-template-columns:1fr 1fr;margin-bottom:10px"><div class="st ${S.view === 'props' ? 'on' : ''}" onclick="S.view='props';draw()"><b>${S.props.length}</b><span>🏠 العقارات</span></div><div class="st ${S.view === 'reqs' ? 'on' : ''}" onclick="S.view='reqs';draw()"><b>${S.reqs.length}</b><span>📋 طلبات الزبائن</span></div></div>`;
function drawMain() {
  if (S.view === 'reqs') return drawReqs();
  const cnt = c => S.props.filter(p => c === 'all' || p.category === c).length;
  let list = S.props.filter(p => (S.cat === 'all' || p.category === S.cat) && (S.type === 'all' || p.type === S.type) && (S.area === 'all' || p.area === S.area)
    && (!S.q || (p.title + p.area + p.agentName + p.desc).includes(S.q)));
  const types = S.cat === 'all' ? [] : TYPES[S.cat];
  $('#app').innerHTML = `${hdr()}
  <main>${tabs()}<div class="stats"><div class="st ${S.cat === 'all' ? 'on' : ''}" onclick="setCat('all')"><b>${cnt('all')}</b><span>كل الأملاك</span></div>
  ${Object.keys(CATS).map(c => `<div class="st ${S.cat === c ? 'on' : ''}" onclick="setCat('${c}')"><b>${cnt(c)}</b><span>${CATS[c]}</span></div>`).join('')}</div>
  <div class="bar"><input id="q" placeholder="بحث..." value="${esc(S.q)}" oninput="S.q=this.value;drawList()">
   <select onchange="S.area=this.value;drawList()"><option value="all">كل المناطق</option>${S.areas.map(a => `<option ${S.area === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select></div>
  ${types.length ? `<div class="chips"><span class="chip ${S.type === 'all' ? 'on' : ''}" onclick="S.type='all';drawMain()">الكل</span>${types.map(t => `<span class="chip ${S.type === t ? 'on' : ''}" onclick="S.type='${t}';drawMain()">${TN[t]}</span>`).join('')}</div>` : ''}
  <div class="grid" id="gl"></div></main>${perm('add') ? '<button class="btn fab" onclick="propForm()">＋ تسجيل عقار</button>' : ''}<div id="mo"></div>`;
  drawList();
}
function drawList() {
  const list = S.props.filter(p => (S.cat === 'all' || p.category === S.cat) && (S.type === 'all' || p.type === S.type) && (S.area === 'all' || p.area === S.area)
    && (!S.q || (p.title + p.area + p.agentName + p.desc).includes(S.q)));
  $('#gl').innerHTML = list.length ? list.map(p => `<div class="pc" onclick="detail('${p.id}')"><div class="im" style="${p.images[0] ? `background-image:url('${esc(p.images[0])}')` : ''}">
   <span class="tag">${CATS[p.category]} · ${tn(p)}</span><span class="tag s">${esc(p.status)}</span></div><div class="pb"><h3>${esc(p.title)}</h3><div class="pr">${money(p)}</div>
   <div class="mt"><span>📍 ${esc(p.area)}</span><span>${p.agentPhoto ? `<img src="${esc(p.agentPhoto)}">` : ''}${esc(p.agentName)}</span></div></div></div>`).join('') : '<div class="empty" style="grid-column:1/-1">لا توجد عقارات</div>';
}
const setCat = c => { S.cat = c; S.type = 'all'; drawMain(); };
const modal = h => { $('#mo').innerHTML = `<div class="ov" onclick="if(event.target==this)closeM()"><div class="md">${h}</div></div>`; };
const closeM = () => $('#mo').innerHTML = '';

function detail(id) {
  const p = S.props.find(x => x.id === id);
  const defs = [...(FT[p.type] || []), ...(CF[p.category] || [])];
  const kv = defs.filter(d => d[0] !== 'customType' && p.data[d[0]] !== undefined && p.data[d[0]] !== '' && p.data[d[0]] !== false).map(d => `<div><small>${d[1]}</small>${p.data[d[0]] === true ? 'نعم ✓' : esc(p.data[d[0]]) + (MK.includes(d[0]) ? (p.currency === 'IQD' ? ' د.ع' : ' $') : '')}</div>`).join('');
  const tel = p.agentPhone.replace(/\D/g, '');
  modal(`<div style="display:flex;justify-content:space-between"><h2>${esc(p.title)}</h2><button class="btn l" onclick="closeM()">✕</button></div>
  ${p.images.length ? `<div class="gal" style="margin-top:10px">${p.images.map(i => `<img src="${esc(i)}">`).join('')}</div>` : ''}
  <div class="pr" style="margin-top:10px">${money(p)}</div><p style="color:var(--mut)">${CATS[p.category]} · ${tn(p)} · 📍 ${esc(p.area)} · ${esc(p.status)}</p>
  <div class="kv">${kv}</div>
  ${(S.me.role === 'admin' || p.agentId === S.me.id) && (p.data.ownerName || p.data.ownerPhone || p.data.ownerAddr) ? `<div class="ag" style="display:block;line-height:1.9"><b>🔒 بيانات المالك (تظهر للمدير والمندوب المسجّل فقط)</b><br>👤 ${esc(p.data.ownerName)}<br>📞 ${p.data.ownerPhone ? `<a href="tel:${esc(String(p.data.ownerPhone).replace(/\D/g, ''))}" style="color:var(--gold)">${esc(p.data.ownerPhone)}</a>` : ''}<br>🏠 ${esc(p.data.ownerAddr)}</div>` : ''}<p style="white-space:pre-wrap">${esc(p.desc)}</p>
  <div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap">${p.map ? `<a class="btn l" style="text-decoration:none" target="_blank" rel="noopener" href="${esc(p.map)}">🗺️ الموقع</a>` : ''}${p.video ? `<a class="btn l" style="text-decoration:none" target="_blank" rel="noopener" href="${esc(p.video)}">▶️ فيديو</a>` : ''}</div>
  <div class="ag">${p.agentPhoto ? `<img src="${esc(p.agentPhoto)}">` : '<div class="av"></div>'}<div><small style="color:var(--mut)">المندوب المسجّل</small><br><b>${esc(p.agentName)}</b></div>
  <a class="btn" style="text-decoration:none" href="tel:${tel}">📞</a><a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${tel}">💬</a></div>
  <div style="display:flex;gap:8px">${canMod(p, 'edit') ? `<button class="btn" onclick="propForm('${p.id}')">تعديل</button>` : ''}${canMod(p, 'del') ? `<button class="btn r" onclick="del('${p.id}')">حذف</button>` : ''}</div>`);
}
async function del(id) {
  if (!confirm('حذف العقار نهائياً؟')) return;
  try { await api('delete', {id}); closeM(); load(); } catch (e) { alert(e.message); }
}

/* ===== نموذج تسجيل / تعديل عقار ===== */
function inp(d, v) {
  const [k, l, t, o] = d, id = 'f_' + k;
  if (t === 'c') return `<label class="ck"><input type="checkbox" id="${id}" ${v ? 'checked' : ''}>${l}</label>`;
  if (t === 's') return `<label>${l}<select id="${id}"><option value="">—</option>${o.map(x => `<option ${v === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>`;
  return `<label>${l}<input id="${id}" ${t === 'n' ? 'type="number" inputmode="decimal"' : ''} value="${esc(v)}"></label>`;
}
function propForm(id) {
  const p = id ? S.props.find(x => x.id === id) : {category:'rent', type:'house', currency:'USD', status:'متاح', data:{}, images:[]};
  IM = [...p.images]; CUR = p.currency || 'USD';
  modal(`<h2 style="margin-bottom:12px">${id ? 'تعديل عقار' : 'تسجيل عقار جديد'}</h2><div class="f">
  <label>الفئة<select id="fc" onchange="fields()">${Object.keys(CATS).map(c => `<option value="${c}" ${p.category === c ? 'selected' : ''}>${CATS[c]}</option>`).join('')}</select></label>
  <label>نوع العقار<select id="ft" onchange="fields()"></select></label>
  <label class="w">العنوان<input id="fti" value="${esc(p.title)}" placeholder="مثال: شقة فاخرة قرب الشارع العام"></label>
  <div class="row w"><label>المنطقة<select id="fa">${S.areas.map(a => `<option ${p.area === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select></label><button class="btn l" onclick="newArea()">＋ منطقة</button></div>
  <label>السعر<input id="fp" type="number" inputmode="decimal" value="${esc(p.price)}"></label>
  <div><label>العملة</label><div class="chips" id="cc" style="margin:6px 0 0"></div></div>
  <div class="w f" id="dyn" style="padding:0"></div>
  <div class="w"><b>🔒 بيانات صاحب العقار</b></div>
  <label>اسم صاحب العقار<input id="fon" value="${esc(p.data.ownerName)}"></label><label>رقم هاتف المالك<input id="fop" inputmode="tel" value="${esc(p.data.ownerPhone)}"></label>
  <label class="w">عنوان سكن المالك<input id="foa" value="${esc(p.data.ownerAddr)}"></label>
  <label>الحالة<select id="fs">${STAT.map(s => `<option ${p.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
  <label>رابط الموقع (Google Maps)<input id="fm" value="${esc(p.map)}" placeholder="https://maps.google.com/..."></label>
  <label class="w">رابط فيديو (YouTube / Drive ...)<input id="fv" value="${esc(p.video)}"></label>
  <label class="w">الصور (من الألبوم أو الكاميرا)<input type="file" accept="image/*" multiple onchange="addImgs(this)"></label>
  <label class="w">أو رابط صورة<span class="row"><input id="fiu" placeholder="https://..."><button class="btn l" type="button" onclick="addUrl()">إضافة</button></span></label>
  <div class="ph w" id="ph"></div>
  <label class="w">ملاحظات ووصف<textarea id="fd" rows="3">${esc(p.desc)}</textarea></label></div>
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="sv" onclick="saveP('${id || ''}')">حفظ</button><button class="btn l" onclick="closeM()">إلغاء</button></div><div class="err" id="fe"></div>`);
  fields(p.type, p.data); phs(); curDraw();
}
function fields(t, vals) {
  const c = $('#fc').value, ts = TYPES[c], cur = t && ts.includes(t) ? t : (ts.includes($('#ft').value) ? $('#ft').value : ts[0]);
  $('#ft').innerHTML = ts.map(x => `<option value="${x}" ${x === cur ? 'selected' : ''}>${TN[x]}</option>`).join('');
  const v = vals || {};
  $('#dyn').innerHTML = [...FT[cur], ...CF[c]].map(d => inp(d, v[d[0]])).join('');
}
async function newArea() {
  const n = prompt('اسم المنطقة الجديدة'); if (!n) return;
  try { await api('addArea', {name:n}); S.areas.push(n.trim()); $('#fa').innerHTML = S.areas.map(a => `<option ${a === n.trim() ? 'selected' : ''}>${esc(a)}</option>`).join(''); } catch (e) { alert(e.message); }
}
function shrink(file, max = 1100) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .78)); };
      im.src = r.result; };
    r.readAsDataURL(file);
  });
}
async function addImgs(el) { for (const f of el.files) IM.push(await shrink(f)); el.value = ''; phs(); }
function addUrl() { const v = $('#fiu').value.trim(); if (v) { IM.push(v); $('#fiu').value = ''; phs(); } }
function phs() { $('#ph').innerHTML = IM.map((s, i) => `<div><img src="${esc(s)}"><i onclick="IM.splice(${i},1);phs()">×</i></div>`).join(''); }
async function upImg(s) { return s.startsWith('data:') ? (await api('upload', {data:s.split(',')[1], name:'p' + Date.now() + '.jpg'})).url : s; }

async function saveP(id) {
  const c = $('#fc').value, t = $('#ft').value, b = $('#sv');
  if (!$('#fti').value.trim()) { $('#fe').textContent = 'أدخل عنوان العقار'; return; }
  if (t === 'other' && !$('#f_customType').value.trim()) { $('#fe').textContent = 'اكتب نوع العقار'; return; }
  b.disabled = true; b.textContent = 'جارٍ الحفظ ورفع الصور...';
  try {
    const data = {};
    [...FT[t], ...CF[c]].forEach(d => { const e = $('#f_' + d[0]); data[d[0]] = d[2] === 'c' ? e.checked : e.value; });
    data.ownerName = $('#fon').value.trim(); data.ownerPhone = $('#fop').value.trim(); data.ownerAddr = $('#foa').value.trim();
    const images = []; for (const s of IM) images.push(await upImg(s));
    await api('save', {prop:{id, category:c, type:t, title:$('#fti').value.trim(), area:$('#fa').value, price:$('#fp').value, currency:CUR,
      status:$('#fs').value, data, images, video:$('#fv').value.trim(), map:$('#fm').value.trim(), desc:$('#fd').value}});
    closeM(); load();
  } catch (e) { $('#fe').textContent = e.message; b.disabled = false; b.textContent = 'حفظ'; }
}

/* ===== إدارة المندوبين (المدير العام) ===== */
const PERMS = {add:'إضافة عقارات', edit:'تعديل عقاراته', del:'حذف عقاراته', all:'رؤية عقارات الجميع'};
function agents() {
  modal(`<div style="display:flex;justify-content:space-between"><h2>المندوبون</h2><button class="btn l" onclick="closeM()">✕</button></div>
  ${S.users.filter(u => u.role !== 'admin').map(u => `<div class="ag">${u.photo ? `<img src="${esc(u.photo)}">` : '<div class="av"></div>'}<div><b>${esc(u.name)}</b>${u.active === 'no' ? ' (موقوف)' : ''}<br><small>${esc(u.phone)}</small></div>
  <button class="btn l" onclick="agentForm('${u.id}')">تعديل</button><button class="btn r" onclick="delU('${u.id}')">حذف</button></div>`).join('') || '<p class="empty">لا يوجد مندوبون</p>'}
  <button class="btn" style="width:100%" onclick="agentForm()">＋ إضافة مندوب</button>`);
}
function agentForm(id) {
  const u = id ? S.users.find(x => x.id === id) : {name:'', phone:'', perms:{add:1, edit:1}, active:'yes', photo:''};
  PHOTO = u.photo || '';
  modal(`<h2 style="margin-bottom:12px">${id ? 'تعديل مندوب' : 'مندوب جديد'}</h2><div class="f">
  <label class="w">الاسم<input id="an" value="${esc(u.name)}"></label><label>رقم الهاتف<input id="ap" inputmode="tel" value="${esc(u.phone)}"></label>
  <label>كلمة السر ${id ? '(اتركها فارغة بدون تغيير)' : ''}<input id="aw" type="text"></label>
  <label class="w">الصورة الشخصية<input type="file" accept="image/*" onchange="agPhoto(this)"></label><div class="w"><img id="apv" src="${esc(PHOTO)}" style="width:70px;height:70px;border-radius:50%;object-fit:cover;${PHOTO ? '' : 'display:none'}"></div>
  <div class="w"><b>الصلاحيات</b></div>${Object.keys(PERMS).map(k => `<label class="ck"><input type="checkbox" id="pm_${k}" ${u.perms[k] ? 'checked' : ''}>${PERMS[k]}</label>`).join('')}
  <label class="ck w"><input type="checkbox" id="aa" ${u.active !== 'no' ? 'checked' : ''}>الحساب فعّال</label></div>
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="sa" onclick="saveU('${id || ''}')">حفظ</button><button class="btn l" onclick="agents()">رجوع</button></div><div class="err" id="fe"></div>`);
}
async function agPhoto(el) { PHOTO = await shrink(el.files[0], 400); $('#apv').src = PHOTO; $('#apv').style.display = 'block'; }
async function saveU(id) {
  const b = $('#sa'); b.disabled = true;
  try {
    const photo = PHOTO ? await upImg(PHOTO) : '', perms = {};
    Object.keys(PERMS).forEach(k => perms[k] = $('#pm_' + k).checked ? 1 : 0);
    await api('saveUser', {user:{id, name:$('#an').value.trim(), phone:$('#ap').value.trim(), pass:$('#aw').value, photo, perms, active:$('#aa').checked}});
    await load(); agents();
  } catch (e) { $('#fe').textContent = e.message; b.disabled = false; }
}
async function delU(id) { if (!confirm('حذف المندوب؟')) return; try { await api('deleteUser', {id}); await load(); agents(); } catch (e) { alert(e.message); } }

/* ===== طلبات الزبائن ===== */
const RST = ['جديد','قيد المتابعة','تم التنفيذ','ملغي'];
const sym = c => c === 'IQD' ? ' د.ع' : ' $';
const bud = r => (r.min || r.max) ? `${r.min ? Number(r.min).toLocaleString('en') : '0'} – ${r.max ? Number(r.max).toLocaleString('en') : 'مفتوح'}${sym(r.currency)}` : 'غير محددة';
function matches(r) {
  return S.props.filter(p => p.category === r.category && p.status === 'متاح' && (!r.type || p.type === r.type) && (!r.area || p.area === r.area)
    && p.currency === r.currency && (!r.max || Number(p.price) <= Number(r.max)) && (!r.min || Number(p.price) >= Number(r.min)));
}
function drawReqs() {
  const list = S.reqs.filter(r => S.rs === 'all' || r.status === S.rs);
  $('#app').innerHTML = `${hdr()}<main>${tabs()}<div class="chips"><span class="chip ${S.rs === 'all' ? 'on' : ''}" onclick="S.rs='all';drawReqs()">الكل</span>
  ${RST.map(t => `<span class="chip ${S.rs === t ? 'on' : ''}" onclick="S.rs='${t}';drawReqs()">${t}</span>`).join('')}</div>
  <div class="grid">${list.length ? list.map(r => `<div class="pc" onclick="reqDetail('${r.id}')"><div class="pb"><div style="display:flex;justify-content:space-between;gap:6px"><h3>👤 ${esc(r.name)}</h3><span class="tag" style="position:static;white-space:nowrap">${esc(r.status)}</span></div>
  <p style="color:var(--mut);font-size:14px;margin:4px 0">${CATS[r.category]} · ${TN[r.type] || 'أي نوع'} · 📍 ${esc(r.area || 'أي منطقة')}</p><div class="pr">${bud(r)}</div>
  <div class="mt"><span>📞 ${esc(r.phone)}</span><span>${esc(r.agentName)}</span></div><div style="margin-top:8px;font-size:13px;color:var(--ok)">✅ ${matches(r).length} عقار مطابق</div></div></div>`).join('') : '<div class="empty" style="grid-column:1/-1">لا توجد طلبات</div>'}</div></main>
  ${perm('add') ? '<button class="btn fab" onclick="reqForm()">＋ طلب زبون</button>' : ''}<div id="mo"></div>`;
}
function reqDetail(id) {
  const r = S.reqs.find(x => x.id === id), m = matches(r), tel = r.phone.replace(/\D/g, '');
  modal(`<div style="display:flex;justify-content:space-between"><h2>👤 ${esc(r.name)}</h2><button class="btn l" onclick="closeM()">✕</button></div>
  <p style="color:var(--mut)">${CATS[r.category]} · ${TN[r.type] || 'أي نوع'} · 📍 ${esc(r.area || 'أي منطقة')} · ${esc(r.status)}</p>
  <div class="pr" style="margin:6px 0">الميزانية: ${bud(r)}</div><p style="white-space:pre-wrap">${esc(r.notes)}</p>
  <div class="ag"><div><small style="color:var(--mut)">المندوب المسؤول</small><br><b>${esc(r.agentName)}</b></div><a class="btn" style="text-decoration:none" href="tel:${tel}">📞 اتصال</a><a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${tel}">💬</a></div>
  <h3 style="margin:12px 0 6px">✅ عقارات مطابقة (${m.length})</h3>
  ${m.map(p => `<div class="ag" style="cursor:pointer" onclick="detail('${p.id}')"><div><b>${esc(p.title)}</b><br><small>📍 ${esc(p.area)} · ${tn(p)}</small></div><b style="color:var(--gold)">${money(p)}</b></div>`).join('') || '<p class="empty" style="padding:14px">لا يوجد عقار متاح مطابق حالياً</p>'}
  <div style="display:flex;gap:8px;margin-top:10px">${canMod(r, 'edit') ? `<button class="btn" onclick="reqForm('${r.id}')">تعديل</button>` : ''}${canMod(r, 'del') ? `<button class="btn r" onclick="delR('${r.id}')">حذف</button>` : ''}</div>`);
}
function rTypes(t) { const c = $('#rc').value; $('#rt').innerHTML = '<option value="">أي نوع</option>' + TYPES[c].map(x => `<option value="${x}" ${x === t ? 'selected' : ''}>${TN[x]}</option>`).join(''); }
function reqForm(id) {
  const r = id ? S.reqs.find(x => x.id === id) : {category:'rent', type:'', area:'', currency:'USD', status:'جديد'};
  CUR = r.currency || 'USD';
  modal(`<h2 style="margin-bottom:12px">${id ? 'تعديل طلب' : 'طلب زبون جديد'}</h2><div class="f">
  <label>اسم الزبون<input id="rn" value="${esc(r.name)}"></label><label>رقم الهاتف<input id="rp" inputmode="tel" value="${esc(r.phone)}"></label>
  <label>الفئة المطلوبة<select id="rc" onchange="rTypes()">${Object.keys(CATS).map(c => `<option value="${c}" ${r.category === c ? 'selected' : ''}>${CATS[c]}</option>`).join('')}</select></label>
  <label>نوع العقار<select id="rt"></select></label>
  <label>المنطقة المفضلة<select id="ra"><option value="">أي منطقة</option>${S.areas.map(a => `<option ${r.area === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select></label>
  <div><label>العملة</label><div class="chips" id="cc" style="margin:6px 0 0"></div></div>
  <label>الميزانية من<input id="rmin" type="number" inputmode="decimal" value="${esc(r.min)}"></label><label>الميزانية إلى<input id="rmax" type="number" inputmode="decimal" value="${esc(r.max)}"></label>
  <label class="w">حالة الطلب<select id="rst">${RST.map(t => `<option ${r.status === t ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
  <label class="w">المواصفات والملاحظات<textarea id="rno" rows="3" placeholder="غرف، طابق، مساحة، ...">${esc(r.notes)}</textarea></label></div>
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="sr" onclick="saveR('${id || ''}')">حفظ</button><button class="btn l" onclick="closeM()">إلغاء</button></div><div class="err" id="fe"></div>`);
  rTypes(r.type); curDraw();
}
async function saveR(id) {
  if (!$('#rn').value.trim() || !$('#rp').value.trim()) { $('#fe').textContent = 'أدخل اسم الزبون ورقم هاتفه'; return; }
  const b = $('#sr'); b.disabled = true;
  try {
    await api('saveReq', {req:{id, name:$('#rn').value.trim(), phone:$('#rp').value.trim(), category:$('#rc').value, type:$('#rt').value, area:$('#ra').value,
      min:$('#rmin').value, max:$('#rmax').value, currency:CUR, status:$('#rst').value, notes:$('#rno').value}});
    closeM(); load();
  } catch (e) { $('#fe').textContent = e.message; b.disabled = false; }
}
async function delR(id) { if (!confirm('حذف الطلب؟')) return; try { await api('deleteReq', {id}); closeM(); load(); } catch (e) { alert(e.message); } }

if (S.token) load(); else draw();
</script>
</body>
</html>
